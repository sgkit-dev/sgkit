[build-system]
requires = ["setuptools >= 77", "setuptools_scm[toml] >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "sgkit"
authors = [{ name = "sgkit Developers", email = "project@sgkit.dev" }]
license = "Apache-2.0"
description = "Statistical genetics toolkit"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
urls = { Homepage = "https://github.com/sgkit-dev/sgkit" }
requires-python = ">=3.11"
dependencies = [
  "numpy >= 2.3.5; sys_platform == \"darwin\"", # Apple ARM chip error
  "numpy >= 2.0; sys_platform != \"darwin\"",
  "xarray >= 2026.9.0",
  "dask[array,dataframe] >= 2022.01.0, <= 2024.8.0",
  "scipy < 1.16",
  "zarr >= 3",
  "numba",
  "fsspec != 2021.6.*",
  "scikit-learn",
  "pandas < 3.0",
]
dynamic = ["version"]

[project.readme]
text = """
**sgkit** is an open source project for analyzing and manipulating genetic
variation data."""
content-type = "text/x-rst"

[project.optional-dependencies]
plink = ["partd", "bed-reader"]
bgen = ["cbgen > 1.0.5"]

[dependency-groups]
test = [
  "packaging",
  "callee",
  "pytest",
  "pytest-cov",
  "pytest-datadir",
  "pytest-mock",
  "hypothesis",
  "scikit-allel",
  "statsmodels",
  "msprime>=1.0",
  "bio2zarr[vcf] >= 0.2; platform_system != \"Windows\"",
  "yarl",
  "matplotlib",
  "networkx",
  "aiohttp",
  "requests",
  "graphviz",
  "sgkit[plink,bgen]",
]
docs = [
  "graphviz",
  "myst_nb",
  "pydata-sphinx-theme",
  "sphinx < 9.0.0",
  "sphinx_autodoc_typehints",
  "sphinx-copybutton",
  "scanpydoc",
  "ipython",
  "matplotlib",
  "seaborn",
  "ablog!=0.10.27",
  "pickleshare",
]
lint = [
  "pre-commit",
]
packaging = [
  "twine",
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "packaging" },
]

[tool.uv]
required-version = ">=0.12.10"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sgkit", "sgkit.*"]
exclude = ["sgkit.tests", "sgkit.tests.*"]
namespaces = false

[tool.setuptools_scm]
version_file = "sgkit/_version.py"

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=validation --cov-fail-under=100"
norecursedirs = [".eggs", "build", "docs", ".hypothesis"]
filterwarnings = ["error", "ignore::DeprecationWarning"]


[tool.isort]
profile = "black"
default_section = "THIRDPARTY"
known_first_party = ["sgkit"]
known_third_party = [
  "allel",
  "dask",
  "fire",
  "glow",
  "hail",
  "hypothesis",
  "invoke",
  "msprime",
  "numba",
  "numpy",
  "pandas",
  "pyspark",
  "pytest",
  "sklearn",
  "sphinx",
  "xarray",
  "yaml",
  "zarr",
]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[[tool.mypy.overrides]]
module = ["dask.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fsspec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["zarr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numcodecs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cbgen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bed_reader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sphinx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yarl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["allel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["toolz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sgkit.*"]
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["sgkit.*.tests.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["validation.*"]
ignore_errors = true
