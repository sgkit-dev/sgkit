name: Wheels

on:
  pull_request:
  push:
    branches:
      - main
      - test
    tags:
      - '*'
  release:
    types: [published]

jobs:
  build:
    # This workflow only runs on the origin org
    if: github.repository_owner == 'sgkit-dev'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --locked --only-group packaging --python "${{ matrix.python-version }}"
    - name: Build a source distribution and a wheel
      run: |
        uv build --no-sources --python "${{ matrix.python-version }}"
        uv run --locked --only-group packaging twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: dist

  unix-test:
    # This workflow only runs on the origin org
    if: github.repository_owner == 'sgkit-dev'
    needs: ['build']
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout repo to subdirectory to get access to scripts
      - uses: actions/checkout@v7
        with:
          path: sgkit-copy
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install wheel and test
        run: |
          python -VV
          # Avoid building SciPy from source in CI.
          wheel=$(ls artifact/sgkit-*.whl)
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python --only-binary scipy "${wheel}[bgen,plink]"
          .venv/bin/python sgkit-copy/.github/scripts/test_sgkit.py
          .venv/bin/python sgkit-copy/.github/scripts/test_sgkit_bgen.py
          .venv/bin/python sgkit-copy/.github/scripts/test_sgkit_plink.py

  windows-test:
    # This workflow only runs on the origin org
    if: github.repository_owner == 'sgkit-dev'
    runs-on: windows-latest
    needs: ['build']
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      # checkout repo to subdirectory to get access to scripts
      - uses: actions/checkout@v7
        with:
          path: sgkit-copy
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install wheel and test
        run: |
          python -VV
          # Avoid building SciPy from source in CI.
          $wheel = (Get-ChildItem artifact/sgkit-*.whl).FullName
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/Scripts/python.exe --only-binary scipy "${wheel}[bgen,plink]"
          .venv/Scripts/python.exe sgkit-copy/.github/scripts/test_sgkit.py
          .venv/Scripts/python.exe sgkit-copy/.github/scripts/test_sgkit_bgen.py
          .venv/Scripts/python.exe sgkit-copy/.github/scripts/test_sgkit_plink.py


  pypi-upload:
    if: github.repository_owner == 'sgkit-dev'
    runs-on: ubuntu-latest
    needs: ['unix-test', 'windows-test']
    steps:
      - name: Download all
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Move to dist
        run: |
          mkdir dist
          cp ./*/*.{whl,gz} dist/.
      - name: Publish package to TestPyPI
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
