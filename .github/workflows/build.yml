name: Build

on:
  push:
  pull_request:
  schedule:
    # Run at the end of every day
    - cron: "0 0 * * *"

jobs:
  build:
    # Scheduled runs only on the origin org
    if: (github.event_name == 'schedule' && github.repository_owner == 'sgkit-dev') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --locked --all-extras --group test --group lint --no-default-groups --python "${{ matrix.python-version }}"
    - name: Run pre-commit
      run: uv run --no-sync pre-commit run --all-files
    - name: Test with pytest and coverage
      run: |
        uv run --no-sync pytest -v --cov=sgkit --cov-report=term-missing
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  test-zarr-version:
    name: Test Zarr Python v3
    # Scheduled runs only on the origin org
    if: (github.event_name == 'schedule' && github.repository_owner == 'sgkit-dev') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zarr: [">=3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --group test --no-default-groups --python 3.11
      - name: Install zarr${{ matrix.zarr }}
        run: |
          uv pip install --python .venv/bin/python --pre 'zarr${{ matrix.zarr }}'
          uv pip uninstall --python .venv/bin/python bio2zarr  # TODO: remove when bio2zarr supports Zarr Python 3
      - name: Run tests
        run: |
          uv run --no-sync pytest
