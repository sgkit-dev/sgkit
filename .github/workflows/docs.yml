name: Docs

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        python-version: "3.11"
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install graphviz  # Needed for documentation
        uv sync --locked --all-extras --group docs --no-default-groups --python "3.11"
        # Use newer Dask for task-graph rendering with NumPy 2.
        uv pip uninstall --python .venv/bin/python dask-expr
        uv pip install --python .venv/bin/python 'dask==2026.8.0'
    - name: Build Sphinx documentation
      run: |
        make -C docs html SPHINXOPTS="-W --keep-going -n"
    - name: Commit documentation changes to gh-pages branch
      run: |
        git clone https://github.com/sgkit-dev/sgkit.git --branch gh-pages --single-branch gh-pages
        mkdir -p gh-pages/latest
        cp -r docs/_build/html/* gh-pages/latest
        cd gh-pages
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update latest documentation" -a || true # Ignore error if no changes present
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        branch: gh-pages
        directory: gh-pages
        force: true
        github_token: ${{ secrets.GITHUB_TOKEN }}
