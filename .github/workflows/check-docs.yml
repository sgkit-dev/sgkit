name: Check docs

on:
  push:
  pull_request:
  schedule:
    # Run at the end of every day
    - cron: "0 0 * * *"

jobs:
  build:
    # Scheduled runs only on the origin org
    if: (github.event_name == 'schedule' && github.repository_owner == 'sgkit-dev') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install graphviz  # Needed for documentation
        uv sync --locked --all-extras --group docs --group lint --no-default-groups --python "${{ matrix.python-version }}"
        # Use newer Dask for task-graph rendering with NumPy 2.
        uv pip uninstall --python .venv/bin/python dask-expr
        uv pip install --python .venv/bin/python 'dask==2026.8.0'
    - name: Run pre-commit
      run: uv run --no-sync pre-commit run --all-files
    - name: Check for Sphinx doc warnings
      run: |
        make -C docs html SPHINXOPTS="-W --keep-going -n"
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: gwas_tutorial
        path: /home/runner/work/sgkit/sgkit/docs/_build/html/reports/examples/gwas_tutorial.err.log
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: relatedness_tutorial
        path: /home/runner/work/sgkit/sgkit/docs/_build/html/reports/examples/relatedness_tutorial.err.log
