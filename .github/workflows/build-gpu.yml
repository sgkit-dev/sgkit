name: Build GPU

on:
  workflow_dispatch:
  # Disabled on 2024-10-14 as this has been broken for over six months
  # https://github.com/sgkit-dev/sgkit/issues/1270
  # push:
  #   branches:
  #     - main

jobs:
  build:

    runs-on: "cirun-gpu-runner--${{ github.run_id }}"
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Run Nvidia-smi
        run: |
          nvidia-smi

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --group test --no-default-groups --python "${{ matrix.python-version }}"
          # Install the CUDA libraries that CuPy uses with its ctk extra.
          uv pip install --python .venv "cupy-cuda12x[ctk]"

      - name: CuPy information
        # Fail here if CuPy can't use the GPU, since the GPU tests would be skipped.
        run: |
          uv run --no-sync python -c "import cupy; cupy.show_config(); print(cupy.ones((2, 2)) @ cupy.ones((2, 2)))"

      - name: Run GPU tagged tests
        run: |
          uv run --no-sync pytest -m gpu -v
